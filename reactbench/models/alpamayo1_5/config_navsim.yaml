_target_: reactbench.models.alpamayo1_5.agent_navsim.AlpamayoAgent
_convert_: all

model_name_or_path: nvidia/Alpamayo-1.5-10B
device: cuda
dtype: bfloat16
attn_implementation: flash_attention_2
local_files_only: false

# Official single-sample rollout settings. The VLM seed is reset before each
# inference, so both members of a pair start from the same VLM random stream.
top_p: 0.98
top_k: null
temperature: 0.6
num_traj_samples: 1
max_generation_length: 256
seed: 42

# A stable per-token seed is derived from this base. Original and edited
# members share identical diffusion noise, while different tokens receive
# different noise. Change the base for an independent evaluation replicate.
diffusion_seed_base: 42
diffusion_kwargs: {}

# NAVSIM provides four poses/images at 2 Hz. Alpamayo expects sixteen ego
# history poses at 10 Hz; poses are interpolated, while the four available
# camera frames are passed unchanged and documented as a temporal domain shift.
source_history_interval_s: 0.5
target_history_interval_s: 0.1
history_steps: 16
frames_per_camera: 4
use_navigation: true

# Save Alpamayo's complete 6.4-second prediction, but calculate robustness
# metrics on the four-second window shared with ReCogDrive and DriveWAM.
trajectory_sampling:
  time_horizon: 6.4
  interval_length: 0.1
metric_horizon_s: 4.0
