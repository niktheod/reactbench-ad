_target_: reactbench.models.alpamayo1_5.agent_paiav.AlpamayoAgent
_convert_: all

model_name_or_path: nvidia/Alpamayo-1.5-10B
device: cuda
dtype: bfloat16
attn_implementation: flash_attention_2
local_files_only: false

# Both members of a pair start from the same VLM and diffusion random streams.
top_p: 0.98
top_k: null
temperature: 0.6
num_traj_samples: 1
max_generation_length: 256
seed: 42
diffusion_seed_base: 42
diffusion_kwargs: {}

# Native PAI-AV/Alpamayo input contract: four cameras, four 10 Hz frames, and
# sixteen 10 Hz 3D ego poses. PAI-AV supplies no route text for these samples.
history_steps: 16
frames_per_camera: 4

# Save all 64 predicted poses and evaluate the shared four-second prefix.
trajectory_sampling:
  time_horizon: 6.4
  interval_length: 0.1
metric_horizon_s: 4.0
